    const promptInput = document.getElementById("promptInput");
    const randomBtn   = document.getElementById("randomBtn");
    const generateBtn = document.getElementById("generateBtn");
    const generateIcon= document.getElementById("generateIcon");
    const galleryGrid = document.getElementById("galleryGrid");
    const promptForm  = document.getElementById("promptForm");

    const SVG = (id, w=16, h=16) =>
        `<span class="icon"><svg width="${w}" height="${h}"><use href="#${id}"/></svg></span>`;

    // ── Custom Dropdowns ──
    function initDropdown(wrapperId, btnId, listId, labelId, hiddenId) {
        const wrapper = document.getElementById(wrapperId);
        const btn     = document.getElementById(btnId);
        const list    = document.getElementById(listId);
        const label   = document.getElementById(labelId);
        const hidden  = document.getElementById(hiddenId);

        btn.addEventListener("click", (e) => {
            e.stopPropagation();
            document.querySelectorAll(".select-wrapper.open").forEach(w => {
                if (w !== wrapper) w.classList.remove("open");
            });
            wrapper.classList.toggle("open");
        });

        list.querySelectorAll("li").forEach(li => {
            li.addEventListener("click", (e) => {
                e.stopPropagation();
                hidden.value = li.dataset.value;
                const textNode = [...li.childNodes].find(n => n.nodeType === 3 && n.textContent.trim());
                label.textContent = textNode ? textNode.textContent.trim() : li.textContent.trim();
                btn.classList.add("selected");
                list.querySelectorAll("li").forEach(l => l.classList.remove("active"));
                li.classList.add("active");
                wrapper.classList.remove("open");
            });
        });
    }

    initDropdown("modelWrapper", "modelBtn", "modelList", "modelLabel", "modelSelect");
    initDropdown("countWrapper", "countBtn", "countList", "countLabel", "countSelect");
    initDropdown("ratioWrapper", "ratioBtn", "ratioList", "ratioLabel", "ratioSelect");

    document.addEventListener("click", () => {
        document.querySelectorAll(".select-wrapper.open").forEach(w => w.classList.remove("open"));
    });

    // ── Theme ──
    if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
        themeIcon.innerHTML = `<svg width="18" height="18"><use href="#icon-sun"/></svg>`;
    }
    themeToggle.addEventListener("click", () => {
        document.body.classList.toggle("dark");
        const isDark = document.body.classList.contains("dark");
        themeIcon.innerHTML = isDark
            ? `<svg width="18" height="18"><use href="#icon-sun"/></svg>`
            : `<svg width="18" height="18"><use href="#icon-moon"/></svg>`;
        localStorage.setItem("theme", isDark ? "dark" : "light");
    });

    // ── Random Prompt ──
    randomBtn.addEventListener("click", () => {
        promptInput.value = RANDOM_PROMPTS[Math.floor(Math.random() * RANDOM_PROMPTS.length)];
        promptInput.focus();
    });

    // ── Gallery Builder ──
    function buildGallery(count, ratio) {
        galleryGrid.innerHTML = "";
        for (let i = 0; i < count; i++) {
            const card = document.createElement("div");
            card.className = "img-card loading";
            card.style.aspectRatio = ratio;
            card.innerHTML = `
                <div class="status-container">
                    <div class="spinner"></div>
                    <span class="icon error-icon">${SVG("icon-warning", 28, 28)}</span>
                    <p class="status-text">Generating...</p>
                </div>
                <img class="result-img" alt="Generated image" />
                <div class="img-overlay">
                    <button class="img-download-btn" title="Download">
                        ${SVG("icon-download", 18, 18)}
                    </button>
                </div>
            `;
            galleryGrid.appendChild(card);
        }
    }

    // ── Dimensions ──
    function getDimensions(ratio) {
        return {"1/1":{width:512,height:512},"16/9":{width:768,height:432},"9/16":{width:432,height:768}}[ratio]
            || {width:512,height:512};
    }

    // ── API Call with retry ──
    async function generateImage(prompt, model, dims, retries = 5) {
        for (let attempt = 0; attempt < retries; attempt++) {
            const res = await fetch(
                `http://localhost:3000/generate?model=${encodeURIComponent(model)}`,
                {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        inputs: prompt,
                        parameters: { width: dims.width, height: dims.height },
                    }),
                }
            );
            if (res.status === 503) {
                const json = await res.json().catch(() => ({}));
                const wait = (json.estimated_time || 20) * 1000;
                await new Promise(r => setTimeout(r, Math.min(wait, 20000)));
                continue;
            }
            if (res.status === 429) {
                await new Promise(r => setTimeout(r, 10000));
                continue;
            }
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.error || `HTTP ${res.status}`);
            }
            const blob = await res.blob();
            if (!blob.type.startsWith("image/")) {
                const text = await blob.text();
                throw new Error(JSON.parse(text).error || "Unexpected response");
            }
            return URL.createObjectURL(blob);
        }
        throw new Error("Model is taking too long. Try again shortly.");
    }

    // ── Card Helpers ──
    function setCardLoaded(card, imageUrl) {
        const img = card.querySelector(".result-img");
        const downloadBtn = card.querySelector(".img-download-btn");
        img.src = imageUrl;
        img.onload = () => {
            card.classList.remove("loading");
            card.classList.add("loaded");
        };
        downloadBtn.addEventListener("click", () => {
            const a = document.createElement("a");
            a.href = imageUrl;
            a.download = `ai-image-${Date.now()}.png`;
            a.click();
        });
    }

    function setCardError(card, message) {
        card.classList.remove("loading");
        card.classList.add("error");
        card.querySelector(".status-text").textContent = message || "Generation failed";
    }

    // ── Form Submit ──
    promptForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (isGenerating) return;

        const prompt = promptInput.value.trim();
        const model  = document.getElementById("modelSelect").value;
        const count  = document.getElementById("countSelect").value;
        const ratio  = document.getElementById("ratioSelect").value;

        if (!prompt) { alert("Please enter a prompt."); return; }
        if (!model)  { alert("Please select an AI model."); return; }
        if (!count)  { alert("Please select number of images."); return; }
        if (!ratio)  { alert("Please select an aspect ratio."); return; }

        const dims = getDimensions(ratio);
        isGenerating = true;
        generateBtn.disabled = true;
        generateIcon.innerHTML = `<svg width="16" height="16" class="spin-icon"><use href="#icon-spinner"/></svg>`;
        generateBtn.childNodes[generateBtn.childNodes.length - 1].textContent = " Generating...";

        buildGallery(parseInt(count), ratio);
        const cards = galleryGrid.querySelectorAll(".img-card");

        await Promise.allSettled(
            Array.from({ length: parseInt(count) }, (_, i) => {
                const card = cards[i];
                return generateImage(prompt, model, dims)
                    .then(url => setCardLoaded(card, url))
                    .catch(err => setCardError(card, err.message));
            })
        );

        isGenerating = false;
        generateBtn.disabled = false;
        generateIcon.innerHTML = `<svg width="16" height="16"><use href="#icon-wand"/></svg>`;
        generateBtn.childNodes[generateBtn.childNodes.length - 1].textContent = " Generate";
    });
</script>
</body>
</html>
